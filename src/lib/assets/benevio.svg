<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 738 220" width="369" height="110">
  <g transform="translate(40,20)" fill="none" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">

    <!-- "bene" en bleu -->

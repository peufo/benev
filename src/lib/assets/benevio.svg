      <path d="M227 120A36 40 0 0 1 299 120"/>
      <line x1="299" y1="120" x2="299" y2="160"/>

      <!-- e -->
      <path d="M408 120A40 40 0 1 0 398.6 145.7"/>
      <line x1="328" y1="120" x2="408" y2="120"/>

      <!-- v -->
      <path d="M428 80L468 160L508 80"/>
    </g>

    <!-- "io" en vert -->
    <g stroke="#10b981">
      <line x1="536" y1="80" x2="536" y2="160"/>
      <circle cx="606" cy="120" r="40"/>
    </g>
  </g>

  <!-- Point du i -->
  <circle cx="576" cy="64" r="18" fill="#10b981"/>

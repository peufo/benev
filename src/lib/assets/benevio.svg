      <!-- b : rayon 40, identique au logo -->
      <line x1="12" y1="40" x2="12" y2="160"/>
      <circle cx="52" cy="120" r="40"/>

      <!-- e : rayon 40 -->
      <path d="M200 120A40 40 0 1 0 190.6 145.7"/>
      <line x1="120" y1="120" x2="200" y2="120"/>

      <!-- n : arche elliptique rx=36 ry=40, sommet a la hauteur d'x -->

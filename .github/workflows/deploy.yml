  build-and-push-image:
    # needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Les tags par défaut incluent `type=ref,event=branch`: `main` produit l'image
      # `:main`, `dev` produit `:dev`. Chaque environnement suit son propre tag.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  trigger-deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    if: success()
    steps:
      # Chaque application Dokploy expose son propre webhook (onglet Deployments).
      - name: Trigger deploy webhook
        env:
          DEPLOY_HOOK_URL: ${{ github.ref_name == 'main' && secrets.DEPLOY_HOOK_URL || secrets.DEPLOY_HOOK_URL_DEV }}
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"

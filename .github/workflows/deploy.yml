name: Create and publish a Docker image

on:
  push:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: benev_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    # `svelte-kit sync` type les clés de $env/dynamic d'après l'environnement présent:
    # une variable absente devient `string | undefined` et fait échouer `svelte-check`.
    # Toutes les clés du .env.example doivent donc être définies, même en factice.
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/benev_test
      EMAIL_DISABLED: 'true'
      MEDIA_DIR: /tmp/benev-media
      ROOT_USER: root@benevio.test
      BODY_SIZE_LIMIT: '10000000'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_USER: ci@benevio.test
      SMTP_PASS: ci
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      PRIVATE_STRIPE_KEY: sk_test_ci
      PRIVATE_STRIPE_WEBHOOK_KEY: whsec_ci
      PUBLIC_STRIPE_KEY: pk_test_ci
      PUBLIC_PRICE_STANDARD: price_ci_standard
      PUBLIC_PRICE_PREMIUM: price_ci_premium
      PUBLIC_PRICE_STANDARD_TO_PREMIUM: price_ci_standard_to_premium
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: mkdir -p $MEDIA_DIR
      - run: bunx prisma migrate deploy
      - run: bun run check
      - run: bun run test:unit
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build-and-push-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  trigger-deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Trigger deploy webhook
        run: curl -X POST ${{ secrets.DEPLOY_HOOK_URL }}
